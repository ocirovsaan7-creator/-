<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вход в админку — Федерация киберспорта Республики Бурятия</title>
<link rel="icon" href="{{ url_for('static', filename='img/flag-buryatia.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="login-shell">
  <form class="form-box" method="post">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <img src="{{ url_for('static', filename='img/flag-buryatia.svg') }}" style="width:36px;height:24px;border-radius:3px">
      <div style="font-weight:800;font-size:14px;line-height:1.3">ФЕДЕРАЦИЯ КИБЕРСПОРТА<br>РЕСПУБЛИКИ БУРЯТИЯ</div>
    </div>
    <h2 style="margin-top:0">Вход в админку</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-error">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <label>Логин</label>
    <input type="text" name="username" required autofocus>
    <label>Пароль</label>
    <input type="password" name="password" required>
    <button class="btn btn-accent" style="margin-top:18px;width:100%">Войти</button>
  </form>
</div>
</body>
</html>
