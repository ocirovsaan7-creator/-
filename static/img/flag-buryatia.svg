<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <!-- Флаг Республики Бурятия: синяя, белая, жёлтая горизонтальные полосы -->
  <rect x="0" y="0" width="900" height="600" fill="#f5d327"/>
  <rect x="0" y="0" width="900" height="330" fill="#1a4fa0"/>
  <rect x="0" y="255" width="900" height="75" fill="#ffffff"/>

  <!-- Стилизованный символ Соёмбо в верхнем левом углу -->
  <g transform="translate(150,140)">
    <!-- пламя -->
    <path d="M0,-70 C20,-55 22,-35 8,-25 C18,-18 18,-2 0,5 C-18,-2 -18,-18 -8,-25 C-22,-35 -20,-55 0,-70 Z" fill="#f5d327"/>
    <!-- солнце -->
    <circle cx="0" cy="35" r="20" fill="#f5d327"/>
    <!-- полумесяц -->
    <path d="M-28,68 a32,32 0 1 0 56,0 a24,24 0 1 1 -56,0 Z" fill="#f5d327"/>
  </g>
</svg>
